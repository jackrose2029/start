/* ---------- seeded PRNG (mulberry32) ---------- */
function RNG(seed) { this.s = (seed >>> 0) || 1; }
RNG.prototype.next = function () { let t = this.s += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
RNG.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
RNG.prototype.int = function (a, b) { return Math.floor(this.range(a, b + 1)); };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; };
RNG.prototype.chance = function (p) { return this.next() < p; };
const strSeed = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const R = new RNG(Date.now() & 0xffffffff); // cosmetic randomness

const pick = arr => arr[Math.floor(R.next() * arr.length) % arr.length];

/* ---------- easing ---------- */
const Ease = {
  linear: t => t,
  inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outQuad: t => 1 - (1 - t) * (1 - t),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  bounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }

  kick(v) { this.v += v; }
}

/* ---------- event bus ---------- */
class EventBus {
  constructor() { this.h = {}; }
  on(ev, fn) { (this.h[ev] || (this.h[ev] = [])).push(fn); return () => { this.h[ev] = (this.h[ev] || []).filter(f => f !== fn); }; }
  emit(ev, data) {
    const list = this.h[ev]; if (!list) return;
    for (const fn of list.slice()) { try { fn(data || {}); } catch (e) { console.warn('[event ' + ev + ']', e); } }
  }
}

const GUIDE_SECTIONS = [
  { t: 'Welcome', b: [
    [`What is Plush Valley?`, `A cozy farming game about plushies. You farm, cook, make friends, ship goods to the bin, and help restore the Great Quilt that once kept the valley warm. Nothing here is ever really dangerous. The worst that happens is a nap.`],
    [`Your first ten minutes`, `Quick Start gives you a random plushie and starts Farm School. It teaches you to move, till soil, plant, water, ship and sleep. Each step tells you the key to press. Follow the guide arrow on screen when it appears; it points at the next target, even across maps.`],

    [`Choosing a way to play`, `Quick Start drops you straight onto a Relaxed farm. Story Mode follows the five chapters of the campaign. Free Farm is a sandbox with no pressure. Play Modes has minigames, festivals and challenges. You can change your mind at any time, and your saves stay separate.`]
  ]},
  { t: 'Controls', b: [
    [`Keyboard`, `Move with W A S D or the arrow keys. Use the current tool or plant with Space or Z. Talk, harvest, open things and confirm with E or Enter. Eat the selected item with F or X. Open your pack with Tab or I. Press Q and R, or [ and ], to change the hotbar. Keys 1 to 0 pick a hotbar slot directly. Hold Shift to run. Press C to swap, T to emote, N for the map, J for your Odd Jobs list, H for What now?, and M to mute. Esc or P opens the pause menu. F3 opens the debug overlay.`],
    [`Mouse`, `Left click uses the selected tool or item. Right click talks or interacts. The mouse wheel changes the hotbar slot. Clicking in menus works everywhere.`],
    [`Gamepad`, `A uses a tool and talks. X eats. Y opens the pack. B cancels. Start pauses. LB and RB change the hotbar. Hold the run button to run. Up to four players can join a co-op farm; each pad presses A to join.`],
    [`Touch`, `Drag on the left side of the screen to move. The big USE button on the right uses your tool. Tap menus directly. Tap-to-move is an option in Settings. You can resize and fade the touch buttons. On touch devices a Go Fullscreen button appears on the title screen.`],
    [`Changing keys`, `Settings lets you rebind the actions that matter most: use, interact, eat, pack, hotbar previous and next, run, swap, emote and map. Reset puts everything back.`]
  ]},
  { t: 'Your Day & Fluff', b: [
    [`The day clock`, `A day starts at 6am and runs until 2am the next morning. The clock dial in the HUD shows the time. Crops grow overnight, shipping pays out at bedtime, and villagers keep their own schedules through the day.`],
    [`Fluff is your energy`, `Every tool costs Fluff. Hoeing costs 2, watering 1, chopping 3, breaking rocks 3, scything 1, fishing 4, and bug-netting 1. Eating food refills Fluff, and so does a good night's sleep. Fluff shows as a meter in the HUD.`],
    [`Running out`, `When Fluff reaches zero you faint and take a nap. Your first faint each day costs a share of your coins, up to a limit. Eating before you get that low is always the better plan.`],
    [`Bedtime`, `Sleep in your bed to end the day. After about 10pm the guide arrow points you to bed. At 2am the day ends and you are sent to bed with a small coin loss, so plan the last tasks of the day early.`],
    [`Saving`, `The game autosaves as you play. You can also choose Save Game in the pause menu at any time. To move your games to another browser or device, see Backup & Transfer.`]
  ]},
  { t: 'Farming', b: [
    [`Clear the land`, `Weeds, stones, twigs, stumps and trees block the soil. Scythe weeds, pick up stones with the pickaxe, and chop trees with the axe. Clearing debris gives you wood, stone and fiber, which you can ship or use for crafting. Chopped trees topple over.`],
    [`Till the soil`, `Use the hoe on grass or cleared ground to make tilled soil. Tilled soil is where crops grow. Facing empty tilled soil reminds you to plant.`],
    [`Plant and water`, `Select a seed and use it on tilled soil. Each crop needs water once a day to keep growing, so water every morning unless it rained. Face a growing crop to see its name, how many days are left, a growth bar and whether it has been watered. Sprinklers water for you once you have built them.`],
    [`Harvest`, `Use or interact with a ripe crop to harvest it. Some crops regrow after harvest, so one planting can give you many harvests. Others are one-and-done. A Perfect Harvest gives a higher-quality crop, and quality crops sell for 25% or 50% more.`],
    [`Watering can`, `Your can holds 20 water at the start, 40 at the next upgrade and 70 at the top. Refill at water.`],
    [`Tool upgrades`, `Visit Ironsides Smithy. The Brass tier costs 500 gold and 3 brass bars. The Golden tier costs 2000 gold and 3 gold bars. Better tools work faster and cover more ground.`],
    [`Crows and scarecrows`, `Crows raid your crops from time to time. A Scarecrow protects about six tiles around it. A Rubber Chicken Scarecrow protects a wider area and squawks when crows come near. Craft a scarecrow from wood and fiber.`],
    [`Hotbar and holding`, `Holding Space or the use button repeats farming tools and seeds if Auto-use is on in Settings. Food and fishing do not repeat, so you cannot eat a whole stack by accident.`]
  ]},
  { t: 'Crops by Season', b: [
    [`Spring`, `Turnip (4 days, one harvest), Carrot (5 days), Strawberry (7 days, regrows every 3 days), and Button Tulip (6 days, one harvest, a flower crop).`],
    [`Summer`, `Tomato (7 days, regrows every 3), Corn (9 days, regrows every 4, also grows in fall), Melon (10 days, one harvest, sells high), and Blueberry (8 days, regrows every 3).`],
    [`Fall`, `Pumpkin (11 days, one harvest, the most valuable fall crop), Cranberry (7 days, regrows every 3), Eggplant (6 days, regrows every 4), Yam (8 days, one harvest), and Corn.`],
    [`Winter`, `Frost Radish (5 days, one harvest), Snowberry (8 days, regrows every 3), Snow Cabbage (8 days, one harvest, sells very high), and Cocoa Bean (9 days, regrows every 4).`],

  ]},
  { t: 'Seasons & Festivals', b: [
    [`The year`, `Each season lasts 14 days. Spring, Summer, Fall and Winter cycle through in that order. Every season brings new crops, new villager dialogue and a new festival.`],

    [`Festivals on day 14`, `Spring: Seed Swap, a seed-trading minigame. Prize: 300 gold, 3 Golden Stitches and the Flower Crown hat. Summer: Splash Day, duck-catching and water-balloon dodging. Prize: 400 gold, 3 Golden Stitches and the Pirate hat. Fall: Harvest Fair, a harvest sprint. Prize: 500 gold, 3 Golden Stitches and the Straw Hat. Winter: Lantern Night, a lantern race. Prize: 600 gold, 3 Golden Stitches and the Wizard Hat.`],
    [`Winning festivals`, `Each festival is a short minigame. Your score decides the prize. Winning a festival also unlocks the Party Animal sticker.`]

  { t: 'Shipping & Shops', b: [
    [`The shipping bin`, `Anything with a sell price can go in the bin: crops, wild forage, fish, eggs and milk, artisan goods, minerals, and wood, stone or fiber. Holding produce and walking up to the bin ships it at once. For anything else, press E at the bin to open the Shipping menu.`],
    [`The Shipping menu`, `Enter ships a whole stack. F ships one item. Each row shows the price per item. Produce sorts first and seeds sort last. Seeds, placed items and story items are flagged with a warning so you do not ship them by mistake. You can take items back out of the bin before you sleep.`],

    [`Shops and hours`, `Dee's Seeds & Sundries (9am to 5pm) sells seasonal seeds and basic supplies and buys everything. Juniper's Bakery (7am to 4pm) sells baked goods and ingredients. Ironsides Smithy (9am to 5pm) sells ores and upgrades tools. Dr. Bolt's Workshop (9am to 5pm) sells building materials and builds structures. Clem's Ranch (8am to 4pm) sells hay and animals. Captain Flapjack's Tackle Dock (6am to 8pm) sells bait and popcorn. The Noodle Nook (10am to 9pm) sells ready-made meals.`],

  { t: 'Cooking & Crafting', b: [

    [`Some dishes to try`, `Turnip Mash is an easy start. Carrot Cake gives speed. Strawberry Shortcake gives luck. Tomato Soup restores Fluff. Corn Chowder warms you. Roasted Yam is a good way to use yams. Hot Cocoa is a winter classic. Some recipes are unlocked later in the story.`],
    [`Better kitchens`, `Upgrading the farmhouse gives a bigger kitchen, which adds quality stars to the dishes you make.`],
    [`Crafting`, `Open the Craft tab in the pause menu to make things you have learned; there are 123 recipes in all, sorted into categories (see the Crafting Catalog). Fences, path stones, scarecrows, sprinklers, compost, fertilizer, a furnace, preserves jars, a loom, a cheese press, lanterns, jelly, poppers and benches are all here. Some recipes are unlocked by story chapters.`],
    [`Machines`, `A furnace turns ore into bars, using coal for fuel. A preserves jar makes jam from fruit and pickles from vegetables. A loom turns wool or lint into cloth. A cheese press turns milk into cheese. A compost bin turns fiber, crops and lint into fertilizer.`]

  { t: 'Animals & Ranch', b: [

    [`Animals to keep`, `Chickens (400 gold) lay eggs every day from a coop. Ducks (600 gold) lay duck eggs every other day from a coop. Cows (1,200 gold) give milk every day from a barn. Sheep (1,600 gold) give wool every third day from a barn.`],
    [`Caring for them`, `Pet your animals to make them happy. Petting them also earns friendship points. Collect products from the coop or barn and ship them, or use them in cooking and machines.`],
    [`Buildings`, `Dr. Bolt's Workshop builds farm buildings. A coop costs 400 gold and 50 wood and holds up to six animals. A barn is built the same way, for cows and sheep.`]

  { t: 'Villagers', b: [
    [`Meeting people`, `Fifteen villagers live in the valley. Among them are Granny Thimble, Mayor Marmalade, Juniper the baker, Captain Flapjack, Dr. Bolt the inventor, Pepper the forager, Clem the rancher, Biscuit the dog, Iggy Ironsides the smith, Dandelion Dee the shopkeeper, Sage, Tilly Tumble, Brambles the beaver, Chef Gnocchi and Nova the moth.`],
    [`Talking`, `Talk to a villager once a day to gain friendship. Each chat earns 12 points. A heart is 100 points.`],
    [`Gifts`, `Give a villager a gift. Loved gifts are worth 80 points, liked gifts 45, neutral gifts 20, and disliked gifts take away 20. Each villager has a list of loved and liked items, and a hobby. Check the Friends tab in the pause menu to see what they like.`],
    [`Heart events`, `Reaching hearts with a villager unlocks heart events and special dialogue. A best friend bond forms once friendship gets high enough, and it earns the Besties sticker.`],

      var sys = sysEls.slice(); sysN = sys.length;
      if (land) {
        // gear top of the stick gutter, the rest top of the button gutter
        var gearX = swap ? vw - sa.r - gw / 2 - sysSize / 2 : sa.l + gw / 2 - sysSize / 2;
        var oX = swap ? sa.l + 8 : vw - sa.r - gw + 8;
        var gear = sys.filter(function (o) { return o.def.gear; })[0], others = sys.filter(function (o) { return !o.def.gear; });
        if (gear) { place(gear.n, gearX, sa.t + 8, sysSize); gear.n.style.fontSize = '20px'; }
        others.forEach(function (o, i) { var ww = Math.min(gw - 16, 56), col = i % 2, row = Math.floor(i / 2); place(o.n, oX + col * (ww + 4), sa.t + 8 + row * 42, ww, sysSize); o.n.style.fontSize = '14px'; });
      } else {
        var rowT = vh - sa.b - gh + 6, sw = Math.min(56, (vw - 24) / sysN - 6), tot = sysN * (sw + 6) - 6, sx0 = (vw - tot) / 2;
        sys.forEach(function (o, i) { place(o.n, sx0 + i * (sw + 6), rowT, sw, sysSize); o.n.style.fontSize = o.def.gear ? '20px' : '14px'; });
      }
    } else {
      if (stickEl) stickEl.style.display = 'none';
      btnEls.forEach(function (o) { o.n.style.display = 'none'; });
      // pad hidden: only a small gear (and pause) sit in the top corners
      sysEls.forEach(function (o) { o.n.style.display = ''; });
      var gearO = sysEls.filter(function (o) { return o.def.gear; })[0], oth = sysEls.filter(function (o) { return !o.def.gear; });
      if (gearO) { place(gearO.n, sa.l + 6, sa.t + 6, 34); gearO.n.style.fontSize = '18px'; }
      oth.forEach(function (o, i) { place(o.n, vw - sa.r - 6 - (i + 1) * 40, sa.t + 6, 34); o.n.style.fontSize = '12px'; });
    }
    // system buttons sit in .mm-root, not in .mm-pad, so they follow the pad opacity separately
    sysEls.forEach(function (o) { o.n.style.opacity = S.pad ? S.opacity : Math.min(S.opacity, 0.6); o.n.style.display = ''; });
  }

  /* ---------- gestures on the play area ---------- */
  var gp = {};   // pointerId -> state
  function gcfg() { return (S.on && S.gestures && cfg.gestures) || null; }
  function onGDown(e) {
    var g = gcfg(); if (!g || !canvas) return;
    if (e.pointerType === 'mouse') return;
    if (e.target !== canvas) return;
    var n = Object.keys(gp).length;
    var s = { x: e.clientX, y: e.clientY, t: performance.now(), keys: {}, moved: 0, multi: n > 0 };
    gp[e.pointerId] = s;
    if (n > 0) for (var id in gp) gp[id].multi = true;
  }
  function gHold(s, dx, dy) {
    var g = gcfg(); if (!g || !g.hold) return;
    var T = Math.max(14, Math.min(window.innerWidth, window.innerHeight) * 0.035), want = {};
    if (!isPlaying()) { return; }   // menus: the swipes below navigate instead
    if (g.hold.left && dx < -T) want.left = 1; if (g.hold.right && dx > T) want.right = 1;
    if (g.hold.up && dy < -T) want.up = 1; if (g.hold.down && dy > T) want.down = 1;
    if (g.hold.diag === false && want.left | want.right && (want.up | want.down)) { if (Math.abs(dx) >= Math.abs(dy)) { delete want.up; delete want.down; } else { delete want.left; delete want.right; } }
    ['left', 'right', 'up', 'down'].forEach(function (k) {
      if (want[k] && !s.keys[k]) { down(g.hold[k]); s.keys[k] = 1; }
      if (!want[k] && s.keys[k]) { up(g.hold[k]); delete s.keys[k]; }
    });
  }
  function onGMove(e) {
    var s = gp[e.pointerId]; if (!s) return;
    var dx = e.clientX - s.x, dy = e.clientY - s.y; s.moved = Math.max(s.moved, Math.hypot(dx, dy)); s.dx = dx; s.dy = dy;
    if (!s.multi) gHold(s, dx, dy);
  }
  function onGUp(e) {
    var s = gp[e.pointerId]; if (!s) return; delete gp[e.pointerId];
    var g = gcfg(); var dt = performance.now() - s.t;
    for (var k in s.keys) up(g && g.hold && g.hold[k]);
    if (!g) return;
    var dx = (e.clientX - s.x), dy = (e.clientY - s.y), dist = Math.hypot(dx, dy);
    if (s.multi) {
      if (dt < 350 && s.moved < 14 && g.twoFinger && Object.keys(gp).length === 0) { tap(g.twoFinger, 80); buzz(12); }
      return;
    }
    var dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
    var fastFlick = dt < 280 && dist > Math.max(34, Math.min(window.innerWidth, window.innerHeight) * 0.08);
    if (!isPlaying()) {
      // menus: swipes move the cursor
      if (g.menuSwipe !== false && dist > 36 && dt < 600) { var mk = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' }[dir]; tap(mk, 60); }
      return;
    }
    if (fastFlick && g.flick && g.flick[dir]) { tap(g.flick[dir], 90); buzz(10); return; }
    if (dt < 260 && s.moved < 12 && g.tap) { tap(g.tap, 90); buzz(8); }
  }

  /* ---------- panel ---------- */
  function openPanel() { buildPanel(); panel.classList.add('show'); }
  function closePanel() { panel.classList.remove('show'); }
  function buildPanel() {
    panel.innerHTML = ''; var box = el('div', 'mm-box', panel); el('h2', '', box, '📱 Mobile Mode');
    function row(label, sub) { var r = el('div', 'mm-row', box); var l = el('label', '', r, label + (sub ? '<small>' + sub + '</small>' : '')); return r; }
    var r1 = row('Mode', 'Standard keeps the game exactly as it is.');
    var seg = el('div', 'mm-seg', r1); ['Standard', 'Mobile'].forEach(function (t, i) {
      var b = el('button', (S.on === (i === 1)) ? 'sel' : '', seg, t); b.onclick = function () { setOn(i === 1); buildPanel(); };
    });
    function sw(label, sub, key) { var r = row(label, sub); var b = el('button', 'mm-sw' + (S[key] ? ' on' : ''), r); b.setAttribute('aria-label', label); b.onclick = function () { S[key] = !S[key]; save(); apply(); b.classList.toggle('on', S[key]); }; }
    function rng(label, sub, key, min, max, step, fmt) {
      var r = row(label, sub), w = el('div', '', r), inp = el('input', '', w); inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = S[key];
      var v = el('small', '', w, fmt(S[key])); v.style.textAlign = 'right';
      inp.oninput = function () { S[key] = parseFloat(inp.value); v.textContent = fmt(S[key]); apply(); }; inp.onchange = function () { save(); };
    }
    sw('Virtual gamepad', 'Stick and buttons in the screen margins.', 'pad');
    rng('Gamepad opacity', 'Lower = more see-through.', 'opacity', 0.1, 1, 0.05, function (v) { return Math.round(v * 100) + '%'; });
    rng('Button size', '', 'size', 0.7, 1.4, 0.05, function (v) { return Math.round(v * 100) + '%'; });
    sw('Touch gestures', cfg.gestureHelp || 'Drag, flick and tap on the play area.', 'gestures');
    sw('Left-handed layout', 'Swap stick and buttons.', 'left');
    sw('Vibration', 'Small buzz on button presses.', 'haptics');
    var a = el('div', 'mm-act', box);
    if (document.documentElement.requestFullscreen) { var f = el('button', '', a, 'Fullscreen'); f.onclick = function () { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { } }; }
    var c = el('button', 'pri', a, 'Done'); c.onclick = closePanel;
    panel.onclick = function (e) { if (e.target === panel) closePanel(); };
  }

  /* ---------- state ---------- */
  function apply() { layout(); updateChip(); }
  function setOn(v) {
    v = !!v; if (v === S.on) return; S.on = v; save(); releaseAll();
    window.MobileMode.on = v; apply();
    try { window.dispatchEvent(new Event('resize')); } catch (e) { }
    if (cfg.onChange) { try { cfg.onChange(v); } catch (e) { } }
    toast(v ? 'Mobile mode on. Tap ⚙ for settings.' : 'Standard mode.');
  }
  function updateChip() {
    var show = !isPlaying() && !panel.classList.contains('show');
    chip.classList.toggle('show', show); chip.classList.toggle('on', S.on);
    chip.textContent = S.on ? '📱 Mobile Mode · On  ⚙' : '📱 Mobile Mode';
  }

  function init(c) {
    cfg = c || {};
    canvas = typeof cfg.canvas === 'string' ? document.querySelector(cfg.canvas) : cfg.canvas;
    styleEl = el('style', '', document.head); styleEl.textContent = CSS + (cfg.css ? '\n' + cfg.css : '');
    root = el('div', 'mm-root', document.body); root.hidden = true;
    chip = el('button', 'mm-chip', document.body); toastEl = el('div', 'mm-toast', document.body); panel = el('div', 'mm-panel', document.body);
    buildPad();
    chip.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    chip.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); if (S.on) openPanel(); else setOn(true); });

  window.MobileMode = { init: init, on: S.on, settings: S, setOn: setOn, refresh: apply, openSettings: function () { openPanel(); }, version: '1.0' };
})();


MobileMode.init({

      { label: 'BAG', key: 'KeyI', slot: 'y' },
      { label: '◀', key: 'KeyQ', small: true },
      { label: '▶', key: 'KeyR', small: true },
      { label: 'RUN', key: 'ShiftLeft', small: true },
      { label: 'MAP', key: 'KeyN', small: true }
    ],

  },
  gestures: { hold: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' }, twoFinger: 'Escape' }
});
