<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Woods II</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; outline: none; image-rendering: auto; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #modal[hidden] { display: none; }
  .m-box { width: min(560px, 92vw); background: #141414; color: #ddd; border: 1px solid #333; border-radius: 10px; padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .m-title { margin: 0 0 6px; font: 22px Georgia, "Times New Roman", serif; color: #f0f0ea; }
  .m-desc { margin: 0 0 14px; font-size: 13.5px; line-height: 1.5; color: #9a9a96; }
  textarea { width: 100%; box-sizing: border-box; height: 170px; resize: vertical; background: #0b0b0b; color: #bcbcb6; border: 1px solid #2c2c2c; border-radius: 6px; padding: 10px; font: 11.5px ui-monospace, Menlo, Consolas, monospace; }
  .m-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .m-row .spacer { flex: 1; }
  button { background: #262626; color: #eee; border: 1px solid #3a3a3a; border-radius: 6px; padding: 8px 14px; font: inherit; font-size: 13.5px; cursor: pointer; }
  button:hover, button:focus-visible { background: #333; border-color: #555; outline: none; }
  button.primary { background: #e8e8e2; color: #111; border-color: #e8e8e2; }
  button.primary:hover { background: #fff; }
  button[hidden] { display: none; }
  .m-msg { min-height: 18px; margin-top: 10px; font-size: 13px; color: #9a9a96; }
  .m-msg.good { color: #9fd49a; }
  .m-msg.bad { color: #f0a0a0; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Hollow game"></canvas>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="m-box">
    <h2 class="m-title" id="m-title">Saves</h2>
    <p class="m-desc"></p>
    <textarea spellcheck="false" aria-label="Save data"></textarea>
    <input type="file" accept=".json,application/json,text/plain" hidden>
    <div class="m-row">
      <button class="primary" data-act="download">Download .json</button>
      <button data-act="copy">Copy text</button>
      <button class="primary" data-act="choose">Choose file…</button>
      <button data-act="import">Import pasted text</button>
      <span class="spacer"></span>
      <button data-act="close">Close</button>
    </div>
    <div class="m-msg" aria-live="polite"></div>
  </div>
</div>

<script src="src/mobile-mode.js"></script>

<script>
MobileMode.init({
  id: 'hollow-woods-ii', canvas: '#game', aspect: 16 / 9,
  playing: function () { try { return Hollow.game.state === 'play'; } catch (e) { return false; } },
  gestureHelp: 'Drag left/right to run, flick up to jump, tap to grab or pull.',
  pad: {
    stick: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' },
    buttons: [
      { label: 'JUMP', key: 'Space', slot: 'a' },
      { label: 'GRAB', key: 'KeyE', slot: 'b' }
    ],
    sys: [{ label: 'II', key: 'Escape' }, { label: 'OK', key: 'Enter' }, { label: 'R', key: 'KeyR' }]
  },
  gestures: { hold: { left: 'ArrowLeft', right: 'ArrowRight', down: 'ArrowDown' }, flick: { up: 'Space' }, tap: 'KeyE', twoFinger: 'Escape' }
});
</script>
