// ---------------- SPLASH (shown on load, then hands off to the title) ----------------
class SplashScene extends Scene {
  constructor() { super(); this.leaving = false; this.len = 4.2; }
  enter() { G.audio.init(); }
  leave() { if (this.leaving) return; this.leaving = true; G.go(() => new TitleScene(), { trans: 'iris' }); }
  update(dt) {
    super.update(dt);
    const n = G.input.navFor(null);
    if (n.confirm || n.back || n.start || n.up || n.down || n.left || n.right) this.leave();
    if (this.t >= this.len) this.leave();
  }
  click() { this.leave(); return true; }
  render(ctx) {
    drawTitleKitchen(ctx, this.t);
    txt(ctx, 'JORJ presents', W / 2, 100, { size: 20, col: '#fff4e0', alpha: clamp(this.t / .8, 0, 1) * .9, lw: 4 });
    const pop = Ease.outBack(clamp(this.t / .6, 0, 1)), s = 1 + Math.sin(this.t * 2) * .02;
    ctx.save(); ctx.translate(W / 2, 250); ctx.scale(s * pop, s * pop);
    txt(ctx, 'STUFFING', 0, -60, { size: 96, col: '#ffd35c', rot: -.06, lw: 16 });
    txt(ctx, 'SHOWDOWN', 20, 30, { size: 96, col: '#ff7a59', rot: .03, lw: 16 });
    panel(ctx, -180, 88, 360, 46, { fill: '#8fdcc2', r: 20 });
    txt(ctx, 'CHAOS IN THE KITCHEN!', 0, 111, { size: 22, col: PAL.ink, stroke: false });
    ctx.restore();
    // loading bar: fills over the splash, then the title takes over
    const bw = 460, bh = 18, bx = (W - bw) / 2, by = 520, p = clamp(this.t / this.len, 0, 1);
    panel(ctx, bx - 6, by - 6, bw + 12, bh + 12, { fill: PAL.navy, r: 14 });
    panel(ctx, bx, by, Math.max(bh, bw * p), bh, { fill: PAL.butter, r: 9 });
    txt(ctx, 'Preheating the oven...', W / 2, by + 52, { size: 16, col: '#fff4e0', alpha: .9 });
    const blink = .5 + .5 * Math.sin(this.t * 4);
    txt(ctx, 'Press any key or tap to start', W / 2, H - 40, { size: 16, col: '#fff4e0', alpha: .35 + .6 * blink });
    txt(ctx, 'v' + VERSION, 20, H - 14, { size: 12, align: 'left', noScale: true, lw: 3 });
  }
}

// ---------------- TITLE ----------------
class TitleScene extends Scene {
  constructor() { super(); this.taps = 0; this.puppets = shuffle(CHARS.filter(c => !c.locked || G.save.data.sock)).slice(0, 12).map((c, i) => { const p = new Plushie(c, { pal: 0, x: 80 + i * 95, y: rr(600, 690) }); p.tx = p.x; p.ty = p.y; return p; }); this.build(); }
  enter() { G.audio.play('menu'); }
  build() {
    const S = G.save.data, items = [];
    if (S.story.next > 0 && !S.story.done) items.push({ label: 'Continue Story (Ch. ' + (S.story.next + 1) + ')', act: () => G.go(new LobbyScene('story', { chapter: S.story.next })) });
    items.push({ label: 'QUICK PLAY', act: () => G.quickSetup(), color: '#e8553f' });
    items.push({ label: 'Story Mode', act: () => G.go(new StoryMapScene()) });
    items.push({ label: 'All Play Modes', act: () => G.go(new ModesScene()) });
    items.push({ label: 'Characters', act: () => G.go(new LobbyScene('gallery')) });
    items.push({ label: 'Wardrobe', act: () => G.go(new WardrobeScene()), badge: S.stitches >= 25 ? S.stitches + '✦' : '' });
    items.push({ label: 'Cooking School', act: () => G.startTutorial(), badge: S.tut ? '' : 'NEW!' });
    items.push({ label: 'Settings', act: () => G.go(new SettingsScene(() => new TitleScene())) });
    items.push({ label: 'Profile & Stickers', act: () => G.go(new ProfileScene()) });
    items.push({ label: 'How to Play', act: () => G.go(new HowToScene(() => new TitleScene())) });
    items.push({ label: 'Credits', act: () => G.go(new CreditsScene(false)) });
    if (document.fullscreenEnabled || document.webkitFullscreenEnabled) items.push({ label: 'Go Fullscreen', act: () => G.toggleFS() });
    this.menu = new MenuList(items, { x: 850, y: 120, w: 380, h: 38, gap: 7, fs: 17, key: 'title', maxVis: 11 });
  }
  update(dt) {
    super.update(dt); this.menu.update(dt, G.input.navFor(null));
    for (const p of this.puppets) { if (hyp(p.tx - p.x, p.ty - p.y) < 10) { p.tx = rr(60, 780); p.ty = rr(590, 690); if (R() < .3) p.anim.sq.v -= 8; if (R() < .2) p.taunt = .9; } const [dx, dy] = norm(p.tx - p.x, p.ty - p.y); p.vx = dx * 70; p.vy = dy * 70; p.x += p.vx * dt; p.y += p.vy * dt; p.ang = Math.atan2(dy, dx); p.face = dx >= 0 ? 1 : -1; if (p.taunt > 0) { p.taunt -= dt; p.anim.rot = Math.sin(p.taunt * 25) * .25; if (p.taunt <= 0) p.anim.rot = 0; } p.animate(dt); }
  }
  render(ctx) {
    drawTitleKitchen(ctx, this.t);
    const s = 1 + Math.sin(this.t * 2) * .02, pop = clamp(this.t / .5, 0, 1);
    ctx.save(); ctx.translate(410, 200); ctx.scale(s * Ease.outBack(pop), s * Ease.outBack(pop));
    txt(ctx, 'STUFFING', 0, -60, { size: 92, col: '#ffd35c', rot: -.06, lw: 16 }); txt(ctx, 'SHOWDOWN', 20, 30, { size: 92, col: '#ff7a59', rot: .03, lw: 16 });
    panel(ctx, -170, 88, 340, 46, { fill: '#8fdcc2', r: 20 }); txt(ctx, 'CHAOS IN THE KITCHEN!', 0, 111, { size: 22, col: PAL.ink, stroke: false });
    ctx.restore(); this.hit(120, 100, 580, 200, () => { this.taps++; G.audio.sfx('squeak'); if (this.taps >= 7) { this.taps = 0; G.toggleChicken(); } });
    const ps = this.puppets.slice().sort((a, b) => a.y - b.y); for (const p of ps) drawPlushie(ctx, p, p.x, p.y - 40, 1.5);
    this.menu.render(ctx, this);
    txt(ctx, 'v' + VERSION + (Save.mem ? '  (saves off)' : '') + '   ✦ ' + G.save.data.stitches + ' Golden Stitches', 20, H - 14, { size: 12, align: 'left', noScale: true, lw: 3 });
